<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Participantes - Transparencia Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .ticket-sold { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; }
        .ticket-free { background-color: #f0fdf4; border-color: #22c55e; color: #15803d; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <script src="header.js"></script>

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="text-center mb-12">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Sorteo de Transparencia Real</h1>
            <p class="text-slate-600">Lista actualizada automáticamente cada 5 minutos</p>
        </header>

        <div id="tickets-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4">
            <p class="text-center col-span-full text-slate-400">Cargando base de datos...</p>
        </div>
    </div>

    <script>
        // REEMPLAZA ESTE ENLACE con tu URL de "Publicar en la Web" (formato CSV)
        const URL_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGRh9mQsyUV8_pwye5MwALot-VwzA2WLe3X3_QKEDsRjOitG8K0OoW48u5DKV1_xJZJ_k8N13p7adf/pub?gid=656677130&single=true&output=csv";

        function cargarTickets() {
            Papa.parse(URL_SHEET, {
                download: true,
                header: true,
                complete: function(results) {
                    const grid = document.getElementById('tickets-grid');
                    grid.innerHTML = ''; // Limpiar mensaje de carga

                    results.data.forEach(fila => {
                        if(!fila.Ticket) return; // Saltar filas vacías

                        const div = document.createElement('div');
                        const esVendido = fila.Estado.toLowerCase() === 'vendido';
                        
                        div.className = `border-2 p-4 rounded-xl text-center transition-all ${esVendido ? 'ticket-sold' : 'ticket-free shadow-sm'}`;
                        
                        div.innerHTML = `
                            <div class="text-xs font-bold uppercase tracking-tighter opacity-60">Ticket</div>
                            <div class="text-2xl font-black">#${fila.Ticket}</div>
                            <div class="mt-2 text-[10px] font-medium truncate">
                                ${esVendido ? fila.Nombre : 'DISPONIBLE'}
                            </div>
                        `;
                        grid.appendChild(div);
                    });
                }
            });
        }

        // Ejecutar carga inicial
        cargarTickets();
    </script>
</body>
</html>
