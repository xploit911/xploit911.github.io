<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Participantes - Transparencia Total</title>
    <meta name="description" content="Consulta la lista de participantes del Sorteo de Transparencia Real. Actualizado automáticamente cada 5 minutos.">
    <meta property="og:title" content="Lista de Participantes - Sorteo de Transparencia Real">
    <meta property="og:description" content="Consulta la transparencia del sorteo en tiempo real.">
    <meta property="og:type" content="website">
    <!-- Puedes cambiar la URL e imagen por las de tu proyecto -->
    <meta property="og:url" content="https://xploit911.github.io/rifa/resultados/">
    <meta property="og:image" content="https://xploit911.github.io/logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .ticket-sold { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; }
        .ticket-free { background-color: #f0fdf4; border-color: #22c55e; color: #15803d; }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <!-- Si tienes un header.js personalizado, déjalo aquí -->
    <!-- <script src="header.js"></script> -->

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="text-center mb-12">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Sorteo de Transparencia Real</h1>
            <p class="text-slate-600">Lista actualizada automáticamente cada 5 minutos</p>
        </header>

        <div id="tickets-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4 place-items-center">
            <p class="text-center col-span-full text-slate-400">
                <span class="loader"></span> Cargando base de datos...
            </p>
        </div>
    </div>

    <script>
        // Reemplaza el enlace con el de tu Google Sheet publicado en CSV si lo necesitas
        const URL_SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGRh9mQsyUV8_pwye5MwALot-VwzA2WLe3X3_QKEDsRjOitG8K0OoW48u5DKV1_xJZJ_k8N13p7adf/pub?gid=656677130&single=true&output=csv";

        function mostrarError(mensaje) {
            const grid = document.getElementById('tickets-grid');
            grid.innerHTML = `<p class="col-span-full text-red-500">${mensaje}</p>`;
        }

        function mostrarCargando() {
            const grid = document.getElementById('tickets-grid');
            grid.innerHTML = `<p class="text-center col-span-full text-slate-400">
                <span class="loader"></span> Cargando base de datos...
            </p>`;
        }

        function cargarTickets() {
            mostrarCargando();
            Papa.parse(URL_SHEET, {
                download: true,
                header: true,
                complete: function(results) {
                    const grid = document.getElementById('tickets-grid');
                    grid.innerHTML = '';

                    if (!results.data || results.data.length === 0) {
                        mostrarError('No se encontraron datos válidos.');
                        return;
                    }

                    let alguno = false;
                    results.data.forEach(fila => {
                        if(!fila.Ticket) return; // Saltar filas vacías
                        alguno = true;

                        const div = document.createElement('div');
                        const esVendido = fila.Estado && fila.Estado.toLowerCase() === 'vendido';

                        div.className = `border-2 p-4 rounded-xl text-center transition-all text-base flex flex-col items-center w-full ${esVendido ? 'ticket-sold' : 'ticket-free shadow-sm'}`;
                        div.setAttribute('aria-label', `Ticket número ${fila.Ticket}, ${esVendido ? 'vendido a ' + (fila.Nombre || 'desconocido') : 'disponible'}`);

                        div.innerHTML = `
                            <div class="text-xs font-bold uppercase tracking-tighter opacity-60">Ticket</div>
                            <div class="text-2xl font-black">#${fila.Ticket}</div>
                            <div class="mt-2 text-[11px] font-medium truncate">${esVendido ? (fila.Nombre || '---') : 'DISPONIBLE'}</div>
                        `;
                        grid.appendChild(div);
                    });

                    if (!alguno) {
                        mostrarError('No hay tickets para mostrar.');
                    }
                },
                error: function() {
                    mostrarError('Error al cargar la base de datos. Intenta nuevamente más tarde.');
                }
            });
        }

        // Carga inicial
        cargarTickets();
        // Recarga automática cada 5 minutos (300000 ms)
        setInterval(cargarTickets, 300000);
    </script>
</body>
</html>
